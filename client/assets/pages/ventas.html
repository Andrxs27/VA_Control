<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InventarioPro — Ventas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/client/assets/css/styles.css">
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <h1>Inventario<span>Pro</span></h1>
      <p>Sistema de Gestión</p>
    </div>
    <nav>
      <span class="nav-section">Principal</span>
      <div class="nav-item" onclick="window.location.href='dashboard.html'"><i class="ti ti-layout-dashboard"></i>Dashboard</div>
      <div class="nav-item" onclick="window.location.href='productos.html'"><i class="ti ti-package"></i>Productos</div>
      <div class="nav-item" onclick="window.location.href='inventario.html'"><i class="ti ti-boxes"></i>Inventario</div>
      <span class="nav-section">Operaciones</span>
      <div class="nav-item active" onclick="window.location.href='ventas.html'"><i class="ti ti-receipt"></i>Ventas</div>
      <div class="nav-item" onclick="window.location.href='ordenes.html'"><i class="ti ti-tool"></i>Órdenes de Servicio<span class="nav-badge" id="badge-ordenes">3</span></div>
      <div class="nav-item" onclick="window.location.href='facturas.html'"><i class="ti ti-file-invoice"></i>Facturas</div>
      <span class="nav-section">Administración</span>
      <div class="nav-item" onclick="window.location.href='usuarios.html'"><i class="ti ti-users"></i>Usuarios</div>
      <div class="nav-item" onclick="window.location.href='reportes.html'"><i class="ti ti-chart-bar"></i>Reportes</div>
    </nav>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar">AD</div>
        <div class="user-info">
          <p>Admin User</p>
          <span>Administrador</span>
        </div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="page-title" id="page-title">Ventas</div>
      <div class="topbar-right">
        <div class="icon-btn" title="Alertas de stock"><i class="ti ti-bell"></i><span class="badge-dot"></span></div>
        <div class="icon-btn" title="Configuración"><i class="ti ti-settings"></i></div>
      </div>
    </header>

    <main class="content">
      <div class="page active" id="page-ventas">
        <div class="section-header">
          <div>
            <div class="section-title">Ventas</div>
            <div class="section-sub">Registro de transacciones</div>
          </div>
          <button class="btn btn-primary" onclick="openModal('modal-venta')"><i class="ti ti-plus"></i> Nueva Venta</button>
        </div>

        <div class="table-wrap">
          <div class="table-toolbar">
            <div class="search-box">
              <i class="ti ti-search"></i>
              <input type="text" id="buscar-venta" placeholder="Buscar por cliente, ID..." oninput="filtrarTabla('tb-ventas',this.value)">
            </div>
            <select class="filter-select" onchange="filtrarVentasPago(this.value)" aria-label="Filtrar por método de pago">
              <option value="">Todos los métodos</option>
              <option value="efectivo">Efectivo</option>
              <option value="tarjeta">Tarjeta</option>
              <option value="transferencia">Transferencia</option>
              <option value="credito">Crédito</option>
            </select>
          </div>

          <table>
            <thead><tr><th>#ID</th><th>Vendedor</th><th>Cliente</th><th>Total</th><th>Método Pago</th><th>Fecha</th><th>Acciones</th></tr></thead>
            <tbody id="tb-ventas"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="modal-venta">
    <div class="modal">
      <div class="modal-head">
        <h2>Nueva Venta</h2>
        <button class="icon-btn" onclick="closeModal('modal-venta')" aria-label="Cerrar modal">
          <i class="ti ti-x"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-grid form-grid-2">
          <div class="form-group">
            <label for="v-vendedor">Vendedor</label>
            <select class="form-select" id="v-vendedor">
              <option value="">Seleccionar...</option>
            </select>
          </div>
          <div class="form-group">
            <label for="v-cliente">Cliente</label>
            <select class="form-select" id="v-cliente">
              <option value="">Seleccionar...</option>
            </select>
          </div>
          <div class="form-group">
            <label for="v-metodo">Método de Pago</label>
            <select class="form-select" id="v-metodo">
              <option value="efectivo">Efectivo</option>
              <option value="tarjeta">Tarjeta</option>
              <option value="transferencia">Transferencia</option>
              <option value="credito">Crédito</option>
            </select>
          </div>
          <div class="form-group">
            <label for="v-total">Total ($)</label>
            <input type="number" id="v-total" placeholder="0.00" step="0.01">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal('modal-venta')">Cancelar</button>
        <button class="btn btn-primary" onclick="guardarVenta()"><i class="ti ti-check"></i> Registrar Venta</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toasts"></div>

  <script src="/client/assets/js/script.js"></script>
</body>
</html>
