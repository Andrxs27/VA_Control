<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VA Control</title>
  <meta http-equiv="refresh" content="0; url=/client/login.html">
</head>
<body>
  <script>
    // Si hay sesión activa, ir al dashboard; si no, al login
    if (localStorage.getItem('va_token')) {
      window.location.href = '/client/assets/pages/dashboard.html';
    } else {
      window.location.href = '/client/assets/pages/login.html';
    }
  </script>
</body>
</html>
