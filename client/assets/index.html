<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VA Control - Cargando...</title>
  <noscript>
    <meta http-equiv="refresh" content="0; url=/client/assets/pages/login.html">
  </noscript>
  <style>
    body { background-color: #111827; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .spinner { border: 4px solid rgba(255,255,255,0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: #3b82f6; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>

  <script>
    // Validar sesión activa antes de que cargue la interfaz
    if (localStorage.getItem('va_token')) {
      window.location.href = '/client/assets/pages/dashboard.html';
    } else {
      window.location.href = '/client/assets/pages/login.html';
    }
  </script>
</body>
</html>
